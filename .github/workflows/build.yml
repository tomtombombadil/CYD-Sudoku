name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add an env here once its src/boards/ file exists.
        env: [cyd28_ili9341, cyd28_st7789, lcdwiki32_st7789, lcdwiki35_st7796, lcdwiki40_st7796]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Set version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.env }}
        env:
          PLATFORMIO_BUILD_SRC_FLAGS: -D CYD_SUDOKU_VERSION=\"${{ steps.ver.outputs.version }}\"
        run: pio run -e ${{ matrix.env }}

      - name: Collect firmware
        run: |
          mkdir -p out
          cp .pio/build/${{ matrix.env }}/firmware.factory.bin \
             out/cyd-sudoku-${{ matrix.env }}-${{ steps.ver.outputs.version }}.bin

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          path: out/*.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
          generate_release_notes: true
