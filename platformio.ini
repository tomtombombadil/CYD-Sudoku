; CYD Sudoku - PlatformIO project
;
; One [env:...] per supported CYD board. Pick the board in VS Code's
; PlatformIO status bar (the "env:" selector), then Build / Upload.
;
; Each env sets exactly one CYD_BOARD_* flag. src/boards/board_select.h
; turns that flag into the matching LovyanGFX hardware class, screen size,
; and peripheral pins. Nothing else in the code should test board flags
; directly - ask board_select.h / the BOARD_* macros instead.

[platformio]
default_envs = cyd28_st7789_res

; ---------------------------------------------------------------------------
; Settings shared by every board
; ---------------------------------------------------------------------------
[env]
; pioarduino = community-maintained PlatformIO platform with Arduino-ESP32 3.x.
; Needed for the ESP32-C5 (NM-CYD-C5); used everywhere so all boards share
; one Arduino core version. Pinned so builds are reproducible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.31
    lvgl/lvgl @ ~9.6.0

build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++17
    -Wall
    ; LVGL reads its settings from include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

; Classic ESP32 boards.
; huge_app.csv: 3 MB app (no OTA) + ~900 KB LittleFS for saves and stats.
; custom_chip_family: the web flasher's chipFamily (default ESP32); envs
; inherit it from the section they extend.
[esp32_classic]
board = esp32dev
board_build.partitions = huge_app.csv

; ---------------------------------------------------------------------------
; Boards
;
; Named by what a user can check: screen size, display driver, touch type.
;   custom_firmware_name  release / web-flasher file name (dots are fine
;                         there; PlatformIO env names can't contain them)
;   custom_board_title    shown on the web flasher
;   custom_board_hint     how to recognise the board, shown on the flasher
;   custom_board_tested   "no" until someone has run the build on that
;                         board; the flasher and README say so
; Chip first when it isn't the plain ESP32, the maker's model in parentheses
; at the end (Tom's rule, same as CYD-Classic-Games).
; CI and tools/make_site.py read these, so this file is the single source.
; ---------------------------------------------------------------------------

[env:cyd28_ili9341_res]
extends = esp32_classic
custom_firmware_name = CYD_2.8in_ILI9341_Resistive
custom_board_title = 2.8" ILI9341 Resistive
custom_board_hint = Back reads ESP32-2432S028 (often ESP32-2432S028R). Usually the single micro-USB version. Try this first if unsure which 2.8" you have.
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_28_ILI9341_RES

[env:cyd28_st7789_res]
extends = esp32_classic
custom_firmware_name = CYD_2.8in_ST7789_Resistive
custom_board_title = 2.8" ST7789 Resistive
custom_board_hint = Back reads ESP32-2432S028 (often ESP32-2432S028R). Usually the micro-USB + USB-C version. Use this if the ILI9341 build shows a garbled or blank screen.
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_28_ST7789_RES

[env:cyd32_st7789_res]
extends = esp32_classic
custom_firmware_name = CYD_3.2in_ST7789_Resistive
custom_board_title = 3.2" ST7789 Resistive
custom_board_hint = Back reads: 3.2" LCD Display, ESP32-32E, 240x320, Resistive Touch.
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_32_ST7789_RES

[env:cyd35_st7796_res]
extends = esp32_classic
custom_firmware_name = CYD_3.5in_ST7796_Resistive
custom_board_title = 3.5" ST7796 Resistive
custom_board_hint = Back reads: 3.5" LCD Display, ESP32-32E, 320x480, Resistive Touch.
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_35_ST7796_RES

[env:cyd40_st7796_res]
extends = esp32_classic
custom_firmware_name = CYD_4.0in_ST7796_Resistive
custom_board_title = 4.0" ST7796 Resistive
custom_board_hint = Back reads: 4.0" LCD Display, ESP32-32E, 320x480, Resistive Touch.
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_40_ST7796_RES

; ---------------------------------------------------------------------------
; ESP32-S3 boards: 16 MB flash, 8 MB octal PSRAM, native USB (the serial log
; goes over the chip's own USB port). partitions_16mb.csv: 6 MB app (no
; OTA) + 2 MB LittleFS.
[esp32_s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions_16mb.csv
custom_chip_family = ESP32-S3
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Freenove FNK0104S. Freenove's README says ST7789; its own TFT_eSPI setup,
; docs table and datasheets say ST7796 - ST7796 it is (CYD-Classic-Games).
[env:s3_40_st7796_cap]
extends = esp32_s3
custom_firmware_name = CYD_ESP32-S3_4.0in_ST7796_Capacitive
custom_board_title = ESP32-S3 4.0" ST7796 Capacitive (Freenove FNK0104S)
custom_board_hint = Freenove ESP32-S3 Display, 4.0 inch, with touch (FNK0104S). USB-C port, BOOT and RESET keys, microSD slot.
custom_board_tested = no
build_flags =
    ${esp32_s3.build_flags}
    -D CYD_BOARD_S3_40_ST7796_CAP

; ---------------------------------------------------------------------------
; ESP32-C5 boards: 16 MB flash, single RISC-V core. The serial log goes out
; through the board's CH340 USB port (UART0), like the classic CYDs.
; Needs LovyanGFX 1.3.0 or later (first with ESP32-C5 support).
[esp32_c5]
board = esp32-c5-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
custom_chip_family = ESP32-C5
lib_deps =
    lovyan03/LovyanGFX @ ^1.3.0
    lvgl/lvgl @ ~9.6.0

; NM-CYD-C5 (RockBase): 2.8" ST7789 240x320, XPT2046 resistive touch,
; two USB-C ports (CH340 + the chip's own USB).
[env:nm_cyd_c5]
extends = esp32_c5
custom_firmware_name = CYD_ESP32-C5_2.8in_ST7789_Resistive
custom_board_title = ESP32-C5 2.8" ST7789 Resistive (NM-CYD-C5)
custom_board_hint = Back reads NM-CYD-C5. Yellow 2.8" board with an ESP32-C5 module and two USB-C ports.
custom_board_tested = no
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_NM_CYD_C5
