; CYD Sudoku - PlatformIO project
;
; One [env:...] per supported CYD board. Pick the board in VS Code's
; PlatformIO status bar (the "env:" selector), then Build / Upload.
;
; Each env sets exactly one CYD_BOARD_* flag. src/boards/board_select.h
; turns that flag into the matching LovyanGFX hardware class, screen size,
; and peripheral pins. Nothing else in the code should test board flags
; directly - ask board_select.h / the BOARD_* macros instead.

[platformio]
default_envs = cyd28r_ili9341

; ---------------------------------------------------------------------------
; Settings shared by every board
; ---------------------------------------------------------------------------
[env]
; pioarduino = community-maintained PlatformIO platform with Arduino-ESP32 3.x.
; Needed for the ESP32-C5 (NM-CYD-C5); used everywhere so all boards share
; one Arduino core version. Pinned so builds are reproducible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.31
    lvgl/lvgl @ ~9.6.0

build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++17
    -Wall
    ; LVGL reads its settings from include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

; Classic ESP32 boards (every CYD except the NM-CYD-C5).
; huge_app.csv: 3 MB app (no OTA) + ~900 KB LittleFS for saves and puzzle packs.
[esp32_classic]
board = esp32dev
board_build.partitions = huge_app.csv

; ---------------------------------------------------------------------------
; Boards
; ---------------------------------------------------------------------------

; 2.8" ESP32-2432S028R, original single micro-USB version.
; ILI9341 240x320, XPT2046 resistive touch on its own SPI pins.
[env:cyd28r_ili9341]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_ESP32_2432S028R

; ---- Not implemented yet: each still needs its LovyanGFX class in
; ---- src/boards/. Left here so the build matrix is visible. Building one
; ---- stops with a clear #error until its board file exists.

; 2.8" ESP32-2432S028R, two-USB (micro-USB + USB-C) version, ST7789 panel.
[env:cyd28r_st7789]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_ESP32_2432S028R_2USB

; 3.2" ESP32-2432S032, ST7789 240x320.
[env:cyd32_st7789]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_ESP32_2432S032

; 3.5" ESP32-3248S035, ST7796 320x480.
[env:cyd35_st7796]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_ESP32_3248S035

; 4.0" CYD, ST7796 320x480.
[env:cyd40_st7796]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_CYD40_ST7796

; NM-CYD-C5 (ESP32-C5, 2.8" 320x240). Best-effort target.
[env:nm_cyd_c5]
board = esp32-c5-devkitc-1
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_NM_CYD_C5
