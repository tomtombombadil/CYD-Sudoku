; CYD Sudoku - PlatformIO project
;
; One [env:...] per supported CYD board. Pick the board in VS Code's
; PlatformIO status bar (the "env:" selector), then Build / Upload.
;
; Each env sets exactly one CYD_BOARD_* flag. src/boards/board_select.h
; turns that flag into the matching LovyanGFX hardware class, screen size,
; and peripheral pins. Nothing else in the code should test board flags
; directly - ask board_select.h / the BOARD_* macros instead.

[platformio]
default_envs = cyd28_st7789

; ---------------------------------------------------------------------------
; Settings shared by every board
; ---------------------------------------------------------------------------
[env]
; pioarduino = community-maintained PlatformIO platform with Arduino-ESP32 3.x.
; Needed for the ESP32-C5 (NM-CYD-C5); used everywhere so all boards share
; one Arduino core version. Pinned so builds are reproducible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.31
    lvgl/lvgl @ ~9.6.0

build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++17
    -Wall
    ; LVGL reads its settings from include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

; Classic ESP32 boards (every CYD except the NM-CYD-C5).
; huge_app.csv: 3 MB app (no OTA) + ~900 KB LittleFS for saves and puzzle packs.
[esp32_classic]
board = esp32dev
board_build.partitions = huge_app.csv

; ---------------------------------------------------------------------------
; Boards
; ---------------------------------------------------------------------------

; Sunton ESP32-2432S028 (the original "CYD"), 2.8" 240x320.
; Silkscreen says ESP32-2432S028 with or without the R. Same pins either way;
; only the panel controller differs. Touch: XPT2046 on its own pins.
[env:cyd28_ili9341]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_SUNTON_2432S028_ILI9341

[env:cyd28_st7789]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_SUNTON_2432S028_ST7789

; LCDwiki "ESP32-32E Display" boards. Silkscreen reads like
; "3.2" LCD Display, ESP32-32E, 240x320, Resistive Touch" - no model number.
; Touch shares the display's SPI bus; SD card has its own.
; 3.2" E32R32P, ST7789P3 IPS 240x320
[env:lcdwiki32_st7789]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_LCDWIKI_E32R32P

; 3.5" E32R35T, ST7796 320x480
[env:lcdwiki35_st7796]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_LCDWIKI_E32R35T

; 4.0" E32R40T, ST7796 320x480
[env:lcdwiki40_st7796]
extends = esp32_classic
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_LCDWIKI_E32R40T

; NM-CYD-C5 (ESP32-C5, 2.8" 320x240). Best-effort target; board file not
; written yet, so building this stops with an #error.
[env:nm_cyd_c5]
board = esp32-c5-devkitc-1
build_flags =
    ${env.build_flags}
    -D CYD_BOARD_NM_CYD_C5
